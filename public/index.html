  function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();var r=false;try{r=document.execCommand('copy')}catch(e){}a.remove();toast(r?ok:'Не удалось скопировать. Выделите текст вручную.')}

function csvOf(cols,rows){function q(v){v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}return [cols].concat(rows).map(function(r){return r.map(q).join(',')}).join('\n')}

/* ---------- разбор таблицы ---------- */
function parseTable(txt){
  txt=txt.trim();if(!txt)return null;
  if(txt[0]==='['||txt[0]==='{'){
    var j;try{j=JSON.parse(txt)}catch(e){return {err:'Это не похоже на корректный JSON: '+e.message}}
    if(!Array.isArray(j))j=[j];
    if(!j.length)return {err:'Массив пустой.'};
    if(Array.isArray(j[0]))return {cols:j[0].map(String),rows:j.slice(1).map(function(r){return r.map(function(v){return v==null?'':String(v)})})};
    var cols=[];j.forEach(function(o){if(o&&typeof o==='object')Object.keys(o).forEach(function(k){if(cols.indexOf(k)<0)cols.push(k)})});
    if(!cols.length)return {err:'В JSON нет объектов с полями.'};
    return {cols:cols,rows:j.map(function(o){return cols.map(function(k){var v=o&&o[k];return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)})})};
  }
  var first=txt.split('\n')[0],d=[',',';','\t'].map(function(x){return [x,first.split(x).length]}).sort(function(a,b){return b[1]-a[1]})[0][0];
  var rows=[],row=[],cell='',inq=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(inq){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else inq=false}else cell+=ch}
    else if(ch==='"')inq=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  row.push(cell);rows.push(row);
  rows=rows.filter(function(r){return r.some(function(v){return v.trim()!==''})});
  if(rows.length<1)return null;
  var n=rows[0].length;
  return {cols:rows[0].map(function(s){return s.trim()}),rows:rows.slice(1).map(function(r){var o=[];for(var i=0;i<n;i++)o.push((r[i]||'').trim());return o})};
}

function doDump(){

    if(act==='archsel'){Object.keys(sel).filter(function(k){return sel[k]}).forEach(function(i){var c=chatById(+i);c.arch=!c.arch;if(cur===c.id)cur=null});sel={};save();render();toast('Готово');return}

  if(e.target.id==='dFiles'){addFiles(e.target.files);e.target.value=''}
  if(e.target.id==='dTableFile'&&e.target.files[0]){var f=e.target.files[0],r=new FileReader();r.onload=function(){$('#dTable').value=r.result;readTable()};r.readAsText(f);e.target.value=''}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='newForm'){e.preventDefault();var n=$('#newName').value.trim();newOpen=false;
    if(n){var id=Math.max.apply(null,chats.map(function(c){return c.id}))+1;chats.push({id:id,name:n,hue:Math.floor(Math.random()*360),star:false,arch:false,unread:0,msgs:[]});folder='all';openChat(id)}else renderSide()}
});
var drop=null;
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}});
function sendMsg(){
  var c=chatById(cur),el=$('#cmp');if(!c||!el)return;var v=el.value.trim();if(!v)return;
  c.msgs.push({id:nextId(),from:'me',kind:'text',text:v,ts:Date.now()});el.value='';save();renderList();renderConv(false);$('#cmp').focus();
}

$('#mark').innerHTML=ic('chat','sm');
load();cur=null;
if(!matchMedia('(max-width:900px)').matches){cur=1;chatById(1).unread=0}
render();
})();
