services:
  - type: web
    name: vygruzka-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false          # введёте в панели Render
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # введёте в панели Render
      - key: API_TOKEN
        generateValue: true  # Render сам создаст случайный токен
      - key: ALLOWED_ORIGIN
        value: "*"
