services:
  - type: web
    name: vygruzka-chats
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false          # https://<project-id>.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false          # публичный ключ anon / publishable
      - key: ICE_SERVERS
        sync: false          # необязательно: TURN-серверы для звонков (JSON)
